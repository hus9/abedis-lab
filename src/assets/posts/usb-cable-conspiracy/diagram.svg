<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .paper { fill: #f7f3ec; }
      .raised { fill: #fffdf8; }
      .ink { fill: #1f1b16; }
      .ink-soft { fill: #4a423a; }
      .accent { fill: #d6552b; }
      .accent-soft { fill: #f4d9cb; }
      .label { font-family: 'Fraunces', Georgia, serif; font-weight: 900; fill: #1f1b16; }
      .stage-label { font-family: 'Atkinson Hyperlegible', sans-serif; font-weight: 700; fill: #1f1b16; }
      .body { font-family: 'Atkinson Hyperlegible', sans-serif; fill: #4a423a; }
      .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; fill: #4a423a; }
    </style>
  </defs>

  <rect width="800" height="420" class="paper"/>

  <text x="400" y="46" text-anchor="middle" class="label" font-size="22">Two pins away from 20 volts</text>

  <!-- connector shell, front-on cross section -->
  <g transform="translate(400,200)">
    <rect x="-170" y="-90" width="340" height="180" rx="18" class="raised" stroke="#4a423a" stroke-width="3"/>

    <!-- pin row: evenly spaced small pins across the shell -->
    <!-- power pins (far sides), data pins (middle), CC pins near center -->
    <g>
      <!-- left power pin, VBUS up to 20V -->
      <circle cx="-130" cy="0" r="14" class="accent"/>
      <text x="-130" y="6" text-anchor="middle" font-size="13" fill="#fffdf8" class="stage-label">V</text>

      <!-- data pins -->
      <circle cx="-80" cy="-40" r="10" fill="none" stroke="#4a423a" stroke-width="2.5"/>
      <circle cx="-80" cy="40" r="10" fill="none" stroke="#4a423a" stroke-width="2.5"/>

      <!-- CC pins, right next to the power line -->
      <circle cx="-20" cy="0" r="12" class="accent-soft" stroke="#d6552b" stroke-width="2.5"/>
      <text x="-20" y="5" text-anchor="middle" font-size="11" fill="#d6552b" class="stage-label">CC</text>

      <circle cx="20" cy="0" r="12" class="accent-soft" stroke="#d6552b" stroke-width="2.5"/>
      <text x="20" y="5" text-anchor="middle" font-size="10" fill="#d6552b" class="stage-label">CC2</text>

      <!-- more data pins -->
      <circle cx="80" cy="-40" r="10" fill="none" stroke="#4a423a" stroke-width="2.5"/>
      <circle cx="80" cy="40" r="10" fill="none" stroke="#4a423a" stroke-width="2.5"/>

      <!-- right power pin -->
      <circle cx="130" cy="0" r="14" class="accent"/>
      <text x="130" y="6" text-anchor="middle" font-size="13" fill="#fffdf8" class="stage-label">V</text>
    </g>

    <!-- danger arc: short jumping from power pin to CC pin -->
    <path d="M -130 -14 Q -75 -60, -22 -12" fill="none" stroke="#d6552b" stroke-width="2" stroke-dasharray="4 5"/>
    <path d="M -110 -34 l 6 10 l -8 2 l 10 12" fill="none" stroke="#d6552b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- labels below connector -->
  <text x="270" y="330" text-anchor="middle" class="body" font-size="14">VBUS — up to 20V</text>
  <text x="400" y="330" text-anchor="middle" class="body" font-size="14" fill="#d6552b">CC pins — sense &amp; power negotiation</text>

  <!-- warning callout -->
  <g transform="translate(400,368)">
    <path d="M 0 -14 L 13 8 L -13 8 Z" class="accent" stroke="#1f1b16" stroke-width="2.5" stroke-linejoin="round"/>
    <text y="6" text-anchor="middle" font-size="13" fill="#fffdf8" class="label">!</text>
  </g>
  <text x="400" y="398" text-anchor="middle" class="body" font-size="15">A miswired short here sends 20V into a 5V-rated pin — instantly.</text>
</svg>
