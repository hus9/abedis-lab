<svg viewBox="0 0 800 440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .paper { fill: #f7f3ec; }
      .ink { fill: #1f1b16; }
      .accent { fill: #d6552b; }
      .line { stroke: #e3dccf; stroke-width: 2; fill: none; }
      .callout { stroke: #b8b0a2; stroke-width: 1.5; stroke-dasharray: 3 4; fill: none; }
      .label { font-family: 'Fraunces', Georgia, serif; font-size: 18px; font-weight: 600; fill: #1f1b16; }
      .sub { font-family: 'Atkinson Hyperlegible', sans-serif; font-size: 13px; fill: #4a423a; }
    </style>
  </defs>

  <rect width="800" height="440" class="paper"/>

  <text x="400" y="40" class="label" text-anchor="middle" font-size="20">Inside a keystroke</text>

  <!-- switch cross-section, centered -->
  <g transform="translate(400, 60)">
    <!-- keycap, resting -->
    <path d="M -110 40 L 110 40 L 85 90 L -85 90 Z" class="paper" stroke="#1f1b16" stroke-width="2.5"/>
    <!-- down-arrow showing press -->
    <line x1="0" y1="10" x2="0" y2="35" stroke="#d6552b" stroke-width="4"/>
    <polygon points="0,45 -12,25 12,25" class="accent"/>

    <!-- housing -->
    <rect x="-90" y="90" width="180" height="220" rx="8" class="paper" stroke="#1f1b16" stroke-width="2.5"/>

    <!-- stem, mid-travel -->
    <rect x="-22" y="90" width="44" height="130" class="accent" opacity="0.85"/>

    <!-- spring, compressed lower half -->
    <path d="M -55 230 q -14 6 0 12 q 14 6 0 12 q -14 6 0 12 q 14 6 0 12 q -14 6 0 12"
          class="line" stroke="#8f887a" stroke-width="3"/>
    <path d="M 55 230 q -14 6 0 12 q 14 6 0 12 q -14 6 0 12 q 14 6 0 12 q -14 6 0 12"
          class="line" stroke="#8f887a" stroke-width="3"/>

    <!-- contact points meeting partway down -->
    <line x1="-70" y1="200" x2="-22" y2="200" stroke="#1f1b16" stroke-width="4"/>
    <line x1="22" y1="200" x2="70" y2="200" stroke="#1f1b16" stroke-width="4"/>
    <circle cx="-18" cy="200" r="6" class="accent"/>
    <circle cx="18" cy="200" r="6" class="accent"/>

    <!-- travel guide line -->
    <line x1="130" y1="90" x2="130" y2="310" stroke="#b8b0a2" stroke-width="2"/>
    <line x1="122" y1="90" x2="138" y2="90" stroke="#b8b0a2" stroke-width="2"/>
    <line x1="122" y1="200" x2="138" y2="200" stroke="#d6552b" stroke-width="2"/>
    <line x1="122" y1="310" x2="138" y2="310" stroke="#b8b0a2" stroke-width="2"/>
  </g>

  <!-- callouts -->
  <line x1="330" y1="80" x2="230" y2="80" class="callout"/>
  <text x="220" y="84" class="sub" text-anchor="end">Keycap</text>

  <line x1="480" y1="150" x2="580" y2="150" class="callout"/>
  <text x="590" y="154" class="sub">Stem slides down</text>

  <line x1="486" y1="258" x2="586" y2="290" class="callout"/>
  <text x="596" y="294" class="sub">Spring compresses</text>

  <line x1="330" y1="200" x2="215" y2="200" class="callout"/>
  <text x="205" y="196" class="sub" text-anchor="end">Contacts meet &#8212;</text>
  <text x="205" y="212" class="sub" text-anchor="end">keystroke registers here</text>

  <text x="565" y="264" class="sub" fill="#d6552b" font-weight="700">2/3 of the way down</text>

  <text x="400" y="415" class="sub" text-anchor="middle">Not at the bottom of the press &#8212; the instant the contacts touch</text>
</svg>
