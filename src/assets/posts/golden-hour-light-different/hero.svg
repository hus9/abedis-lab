<svg viewBox="0 0 800 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">A low evening sun glowing through a pane of frosted glass, its light scattering softly around the edges instead of casting one sharp beam</title>
  <desc id="hero-desc">A warm sun sits low near the horizon. Between the sun and the viewer floats a translucent, textured pane of frosted glass. Light doesn't pass straight through it — it wraps and scatters around the pane's edges in soft curved rays that fan out toward the viewer, and the shadow it casts on the ground fades out instead of stopping sharply.</desc>
  <defs>
    <style>
      .paper { fill: #f7f3ec; }
      .raised { fill: #fffdf8; }
      .ink { fill: #1f1b16; }
      .ink-soft { fill: #4a423a; }
      .accent { fill: #d6552b; }
      .accent-stroke { stroke: #d6552b; }
      .label { font-family: 'Fraunces', Georgia, serif; font-weight: 900; fill: #1f1b16; }
      .body { font-family: 'Atkinson Hyperlegible', sans-serif; fill: #4a423a; }
    </style>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d6552b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#d6552b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skyWash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4d9cb" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f7f3ec" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="shadowFade" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1f1b16" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#1f1b16" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="440" class="paper"/>
  <rect x="0" y="0" width="800" height="380" fill="url(#skyWash)"/>

  <!-- distant hill silhouette -->
  <path d="M 0,400 Q 200,370 400,392 T 800,388 L 800,440 L 0,440 Z" class="ink" opacity="0.05"/>

  <!-- sun glow halo -->
  <circle cx="185" cy="320" r="150" fill="url(#sunGlow)"/>

  <!-- soft wrap-around rays, bending around the pane's edges -->
  <g fill="none" stroke="#d6552b" stroke-linecap="round">
    <path d="M 185,320 Q 330,120 470,150 Q 610,175 760,230" stroke-width="3" opacity="0.35"/>
    <path d="M 185,320 Q 330,180 470,210 Q 620,235 770,270" stroke-width="3" opacity="0.3"/>
    <path d="M 185,320 Q 340,300 470,300 Q 620,300 780,300" stroke-width="4" opacity="0.4"/>
    <path d="M 185,320 Q 330,420 470,395 Q 610,375 760,340" stroke-width="3" opacity="0.3"/>
    <path d="M 185,320 Q 320,470 470,450 Q 610,435 750,380" stroke-width="3" opacity="0.22"/>
  </g>

  <!-- sun -->
  <circle cx="185" cy="320" r="46" class="accent"/>
  <circle cx="185" cy="320" r="46" fill="none" stroke="#fffdf8" stroke-width="2" opacity="0.4"/>

  <!-- frosted glass pane -->
  <rect x="330" y="110" width="140" height="270" rx="18" class="raised" opacity="0.6" stroke="#4a423a" stroke-width="2" stroke-dasharray="1 5" stroke-opacity="0.5"/>
  <g stroke="#4a423a" stroke-width="1.5" opacity="0.14">
    <line x1="342" y1="135" x2="458" y2="135"/>
    <line x1="342" y1="160" x2="458" y2="160"/>
    <line x1="342" y1="185" x2="458" y2="185"/>
    <line x1="342" y1="210" x2="458" y2="210"/>
    <line x1="342" y1="235" x2="458" y2="235"/>
    <line x1="342" y1="260" x2="458" y2="260"/>
    <line x1="342" y1="285" x2="458" y2="285"/>
    <line x1="342" y1="310" x2="458" y2="310"/>
    <line x1="342" y1="335" x2="458" y2="335"/>
    <line x1="342" y1="360" x2="458" y2="360"/>
  </g>

  <!-- ground -->
  <line x1="0" y1="380" x2="800" y2="380" stroke="#e3dccf" stroke-width="2"/>
  <ellipse cx="560" cy="382" rx="200" ry="16" fill="url(#shadowFade)"/>

  <text x="400" y="422" text-anchor="middle" class="body" font-size="16">No clouds, no haze — the clear air itself is the frosted glass.</text>
</svg>
