<svg viewBox="0 0 800 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="diag-title diag-desc">
  <title id="diag-title">Side-by-side beam paths: sunlight crossing one air mass straight down at noon versus a much longer, scattering-heavy path through roughly 38 air masses at a low golden-hour sun angle</title>
  <desc id="diag-desc">Two panels share a ground line. In the left panel, marked Noon, a sun sits directly overhead and a single straight arrow drops almost straight down to the ground with barely any scattering, labeled 1 air mass. In the right panel, marked Golden Hour, a sun sits low near the horizon and its light follows a long zigzagging path bouncing between many scatter points before reaching the ground, labeled roughly 38 air masses, illustrating a far longer, far more scattered trip through the atmosphere.</desc>
  <defs>
    <style>
      .paper { fill: #f7f3ec; }
      .ink { fill: #1f1b16; }
      .ink-soft { fill: #4a423a; }
      .accent { fill: #d6552b; }
      .line { stroke: #e3dccf; stroke-width: 2; }
      .label { font-family: 'Fraunces', Georgia, serif; font-weight: 900; fill: #1f1b16; }
      .stat { font-family: 'Fraunces', Georgia, serif; font-weight: 900; fill: #d6552b; }
      .body { font-family: 'Atkinson Hyperlegible', sans-serif; fill: #4a423a; }
    </style>
  </defs>

  <rect width="800" height="440" class="paper"/>

  <!-- panel divider -->
  <line x1="400" y1="50" x2="400" y2="345" stroke="#e3dccf" stroke-width="2" stroke-dasharray="5 6"/>

  <!-- shared ground line -->
  <line x1="55" y1="335" x2="745" y2="335" class="line"/>

  <!-- ===== LEFT PANEL: NOON ===== -->
  <text x="210" y="45" text-anchor="middle" class="label" font-size="24">NOON</text>

  <!-- sun directly overhead -->
  <circle cx="210" cy="88" r="18" class="accent"/>

  <!-- straight drop -->
  <line x1="210" y1="106" x2="210" y2="322" stroke="#1f1b16" stroke-width="5" stroke-linecap="round"/>
  <polygon points="210,335 200,315 220,315" class="ink"/>

  <!-- minimal scatter -->
  <circle cx="210" cy="170" r="4" class="accent" opacity="0.5"/>
  <circle cx="210" cy="250" r="4" class="accent" opacity="0.5"/>

  <!-- observer -->
  <circle cx="210" cy="335" r="6" class="ink"/>

  <text x="210" y="365" text-anchor="middle" class="stat" font-size="30">1</text>
  <text x="210" y="390" text-anchor="middle" class="body" font-size="15">air mass</text>
  <text x="210" y="412" text-anchor="middle" class="body" font-size="14">straight down, barely scattered</text>

  <!-- ===== RIGHT PANEL: GOLDEN HOUR ===== -->
  <text x="590" y="45" text-anchor="middle" class="label" font-size="24">GOLDEN HOUR</text>

  <!-- sun low near horizon -->
  <circle cx="650" cy="90" r="18" class="accent"/>

  <!-- long zigzag scattering path -->
  <polyline points="650,90 590,120 630,150 560,180 610,210 540,240 590,265 500,290 540,310 460,335"
            fill="none" stroke="#1f1b16" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="460,335 470,315 485,325" class="ink"/>

  <!-- scatter points along the path -->
  <g class="accent" opacity="0.75">
    <circle cx="590" cy="120" r="5"/>
    <circle cx="630" cy="150" r="5"/>
    <circle cx="560" cy="180" r="5"/>
    <circle cx="610" cy="210" r="5"/>
    <circle cx="540" cy="240" r="5"/>
    <circle cx="590" cy="265" r="5"/>
    <circle cx="500" cy="290" r="5"/>
    <circle cx="540" cy="310" r="5"/>
  </g>

  <!-- observer -->
  <circle cx="460" cy="335" r="6" class="ink"/>

  <text x="555" y="365" text-anchor="middle" class="stat" font-size="30">~38</text>
  <text x="555" y="390" text-anchor="middle" class="body" font-size="15">air masses</text>
  <text x="555" y="412" text-anchor="middle" class="body" font-size="14">grazing angle, scattered again and again</text>
</svg>
