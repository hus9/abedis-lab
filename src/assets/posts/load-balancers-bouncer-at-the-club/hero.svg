<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">A bouncer at a velvet rope checking a guest's ID and waving people toward three glowing doors</title>
  <desc id="hero-desc">An illustration of a bouncer standing at a velvet rope, checking a guest's ID card, while behind him three separate doors glow in different colors — one crowded with dots, one half full, one nearly empty — representing a load balancer routing traffic to backend servers.</desc>
  <defs>
    <style>
      .paper { fill: #f7f3ec; }
      .raised { fill: #fffdf8; }
      .ink { fill: #1f1b16; }
      .ink-soft { fill: #4a423a; }
      .accent { fill: #d6552b; }
      .amber { fill: #c98a2b; }
      .rust { fill: #a8392a; }
      .line { stroke: #e3dccf; stroke-width: 2; fill: none; }
      .label { font-family: 'Fraunces', Georgia, serif; font-weight: 900; fill: #1f1b16; }
      .body { font-family: 'Atkinson Hyperlegible', sans-serif; fill: #4a423a; }
    </style>
  </defs>

  <rect width="800" height="400" class="paper"/>

  <!-- floor line -->
  <line x1="0" y1="352" x2="800" y2="352" class="line"/>

  <!-- velvet rope stanchions -->
  <g class="ink">
    <rect x="118" y="220" width="10" height="120" rx="3"/>
    <ellipse cx="123" cy="220" rx="14" ry="10"/>
    <rect x="238" y="220" width="10" height="120" rx="3"/>
    <ellipse cx="243" cy="220" rx="14" ry="10"/>
  </g>
  <path d="M 123 232 Q 183 260 243 232" fill="none" stroke="#d6552b" stroke-width="6" stroke-linecap="round"/>

  <!-- Bouncer, arms-crossed silhouette -->
  <g transform="translate(178,340)">
    <path d="M -46 -6 Q -50 -110 0 -114 Q 50 -110 46 -6 Z" class="ink"/>
    <circle cx="0" cy="-140" r="28" class="raised" stroke="#1f1b16" stroke-width="4"/>
    <!-- crossed arms -->
    <path d="M -40 -60 Q 0 -40 40 -60" fill="none" stroke="#fffdf8" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Guest holding up an ID card -->
  <g transform="translate(70,344)">
    <path d="M -28 -4 Q -30 -74 0 -78 Q 30 -74 28 -4 Z" class="ink-soft"/>
    <circle cx="0" cy="-96" r="19" class="raised" stroke="#4a423a" stroke-width="3"/>
    <!-- arm raised holding ID -->
    <path d="M 18 -50 Q 46 -70 60 -104" fill="none" stroke="#4a423a" stroke-width="7" stroke-linecap="round"/>
  </g>
  <g transform="translate(60,240)">
    <rect x="0" y="0" width="46" height="30" rx="4" class="raised" stroke="#1f1b16" stroke-width="3"/>
    <circle cx="12" cy="15" r="6" class="ink-soft" opacity="0.5"/>
    <line x1="24" y1="9" x2="40" y2="9" class="line"/>
    <line x1="24" y1="16" x2="40" y2="16" class="line"/>
    <line x1="24" y1="23" x2="36" y2="23" class="line"/>
  </g>

  <!-- Three doors, each a different color, each with a different crowd level -->
  <!-- Door 1: crowded -->
  <g transform="translate(400,120)">
    <rect x="0" y="0" width="110" height="232" rx="10" class="accent" opacity="0.9"/>
    <rect x="0" y="0" width="110" height="232" rx="10" fill="none" stroke="#1f1b16" stroke-width="3"/>
    <g fill="#fffdf8" opacity="0.9">
      <circle cx="24" cy="40" r="6"/><circle cx="50" cy="34" r="6"/><circle cx="78" cy="42" r="6"/>
      <circle cx="30" cy="64" r="6"/><circle cx="58" cy="60" r="6"/><circle cx="86" cy="66" r="6"/>
      <circle cx="20" cy="88" r="6"/><circle cx="46" cy="90" r="6"/><circle cx="74" cy="86" r="6"/>
      <circle cx="34" cy="112" r="6"/><circle cx="62" cy="114" r="6"/><circle cx="90" cy="110" r="6"/>
    </g>
    <text x="55" y="200" text-anchor="middle" class="body" font-size="13" fill="#fffdf8">packed</text>
  </g>

  <!-- Door 2: half full -->
  <g transform="translate(540,120)">
    <rect x="0" y="0" width="110" height="232" rx="10" class="amber" opacity="0.9"/>
    <rect x="0" y="0" width="110" height="232" rx="10" fill="none" stroke="#1f1b16" stroke-width="3"/>
    <g fill="#fffdf8" opacity="0.9">
      <circle cx="30" cy="50" r="6"/><circle cx="68" cy="46" r="6"/>
      <circle cx="46" cy="80" r="6"/><circle cx="80" cy="78" r="6"/>
    </g>
    <text x="55" y="200" text-anchor="middle" class="body" font-size="13" fill="#fffdf8">room</text>
  </g>

  <!-- Door 3: nearly empty, glowing invitingly -->
  <g transform="translate(680,120)">
    <rect x="0" y="0" width="110" height="232" rx="10" class="rust" opacity="0.85"/>
    <rect x="0" y="0" width="110" height="232" rx="10" fill="none" stroke="#1f1b16" stroke-width="3"/>
    <circle cx="55" cy="70" r="6" fill="#fffdf8" opacity="0.9"/>
    <text x="55" y="200" text-anchor="middle" class="body" font-size="13" fill="#fffdf8">wide open</text>
  </g>

  <!-- routing arrow, bouncer's gaze sending the next guest to the emptiest floor -->
  <path d="M 270 200 Q 460 60 660 130" fill="none" stroke="#1f1b16" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>
  <path d="M 650 122 L 668 130 L 652 142 Z" class="ink"/>

  <text x="400" y="386" text-anchor="middle" class="body" font-size="16">Same bouncer, three floors — he sends you where there's room.</text>
</svg>
