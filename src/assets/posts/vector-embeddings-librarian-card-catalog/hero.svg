<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">A library card catalog drawer morphing into a glowing grid of numbers</title>
  <desc id="hero-desc">An illustration of a wooden card-catalog drawer on the left, its index cards trailing off into a grid of glowing orange coordinate points on the right — some points clustered tightly together, others scattered far apart, showing text turning into measurable position.</desc>
  <defs>
    <style>
      .paper { fill: #f7f3ec; }
      .raised { fill: #fffdf8; }
      .wood { fill: #c99a6b; }
      .wood-dark { fill: #a97c4f; }
      .ink { fill: #1f1b16; }
      .ink-soft { fill: #4a423a; }
      .accent { fill: #d6552b; }
      .accent-line { stroke: #d6552b; }
      .line { stroke: #e3dccf; stroke-width: 2; fill: none; }
      .label { font-family: 'Fraunces', Georgia, serif; font-weight: 900; fill: #1f1b16; }
      .body { font-family: 'Atkinson Hyperlegible', sans-serif; fill: #4a423a; }
    </style>
  </defs>

  <rect width="800" height="400" class="paper"/>

  <!-- Card catalog cabinet, left side -->
  <g transform="translate(70,90)">
    <rect x="0" y="0" width="180" height="230" rx="6" class="wood" stroke="#1f1b16" stroke-width="3"/>
    <!-- drawer fronts, stacked -->
    <g>
      <rect x="14" y="14" width="152" height="46" rx="4" class="wood-dark" stroke="#1f1b16" stroke-width="2.5"/>
      <circle cx="90" cy="37" r="5" class="raised"/>
      <rect x="14" y="68" width="152" height="46" rx="4" class="wood-dark" stroke="#1f1b16" stroke-width="2.5"/>
      <circle cx="90" cy="91" r="5" class="raised"/>
      <!-- open drawer, pulled toward the grid -->
      <rect x="14" y="122" width="152" height="52" rx="4" class="accent" stroke="#1f1b16" stroke-width="2.5"/>
      <circle cx="90" cy="148" r="5" class="raised"/>
      <rect x="14" y="182" width="152" height="40" rx="4" class="wood-dark" stroke="#1f1b16" stroke-width="2.5"/>
      <circle cx="90" cy="202" r="5" class="raised"/>
    </g>
  </g>

  <!-- Index cards spilling out and thinning into dots -->
  <g stroke="#1f1b16" stroke-width="2">
    <rect x="255" y="150" width="70" height="46" rx="3" class="raised"/>
    <rect x="270" y="160" width="46" height="26" rx="2" class="raised" opacity="0.85"/>
    <rect x="330" y="168" width="52" height="34" rx="3" class="raised" opacity="0.7" stroke-width="1.6"/>
  </g>
  <g class="body" font-size="9">
    <line x1="265" y1="164" x2="310" y2="164" class="line"/>
    <line x1="265" y1="172" x2="300" y2="172" class="line"/>
    <line x1="265" y1="180" x2="305" y2="180" class="line"/>
  </g>

  <!-- Transition dots, shrinking and glowing -->
  <g class="accent">
    <circle cx="400" cy="185" r="6"/>
    <circle cx="425" cy="178" r="5"/>
    <circle cx="448" cy="192" r="4.4"/>
  </g>

  <!-- Grid of glowing coordinate points, right side -->
  <g>
    <!-- faint grid lines -->
    <g class="line" opacity="0.6">
      <line x1="500" y1="60" x2="500" y2="340"/>
      <line x1="580" y1="60" x2="580" y2="340"/>
      <line x1="660" y1="60" x2="660" y2="340"/>
      <line x1="740" y1="60" x2="740" y2="340"/>
      <line x1="480" y1="90" x2="770" y2="90"/>
      <line x1="480" y1="150" x2="770" y2="150"/>
      <line x1="480" y1="210" x2="770" y2="210"/>
      <line x1="480" y1="270" x2="770" y2="270"/>
      <line x1="480" y1="320" x2="770" y2="320"/>
    </g>

    <!-- tightly clustered points: similar meaning -->
    <g class="accent">
      <circle cx="560" cy="110" r="7"/>
      <circle cx="572" cy="120" r="7"/>
      <circle cx="552" cy="126" r="6"/>
    </g>
    <text x="562" y="98" text-anchor="middle" class="body" font-size="11" font-style="italic">close in meaning</text>

    <!-- scattered points: unrelated meaning -->
    <g class="ink">
      <circle cx="700" cy="290" r="6"/>
      <circle cx="620" cy="240" r="6"/>
      <circle cx="730" cy="150" r="6"/>
      <circle cx="650" cy="310" r="6"/>
    </g>
    <line x1="700" y1="290" x2="620" y2="240" class="line" stroke-dasharray="4 4"/>
    <line x1="700" y1="290" x2="730" y2="150" class="line" stroke-dasharray="4 4"/>
  </g>

  <text x="400" y="386" text-anchor="middle" class="body" font-size="16">Every book gets a card. Every card becomes a point on a map.</text>
</svg>
