<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .paper { fill: #f7f3ec; }
      .ink { fill: #1f1b16; }
      .ink-soft { fill: #4a423a; }
      .accent { fill: #d6552b; }
      .accent-line { stroke: #d6552b; }
      .faded { fill: #4a423a; opacity: 0.35; }
      .line { stroke: #e3dccf; stroke-width: 2; fill: none; }
      .label { font-family: 'Fraunces', Georgia, serif; font-weight: 900; fill: #1f1b16; }
      .accent-label { font-family: 'Fraunces', Georgia, serif; font-weight: 900; fill: #d6552b; }
      .caption { font-family: 'Atkinson Hyperlegible', sans-serif; fill: #4a423a; }
      .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; fill: #4a423a; }
    </style>
  </defs>

  <rect width="800" height="400" class="paper"/>

  <text x="400" y="38" text-anchor="middle" class="label" font-size="24">Same 92% threshold, different pool size</text>

  <line x1="400" y1="55" x2="400" y2="345" class="line" stroke-dasharray="5 7"/>

  <!-- LEFT: sharp distribution, top-p circle only needs 3 words -->
  <text x="200" y="80" text-anchor="middle" class="label" font-size="20">Confident</text>

  <rect x="52" y="98" width="300" height="112" rx="14" fill="none" class="accent-line" stroke-width="3" stroke-dasharray="6 6"/>
  <text x="330" y="90" text-anchor="end" class="accent-label" font-size="18">92%</text>

  <rect x="60" y="112" width="236" height="26" rx="5" class="accent"/>
  <text x="304" y="130" class="mono" font-size="15">"the"</text>
  <rect x="60" y="144" width="86" height="26" rx="5" class="accent"/>
  <text x="154" y="162" class="mono" font-size="15">"a"</text>
  <rect x="60" y="176" width="73" height="26" rx="5" class="accent"/>
  <text x="141" y="194" class="mono" font-size="15">"an"</text>

  <rect x="60" y="222" width="22" height="18" rx="4" class="faded"/>
  <rect x="60" y="248" width="14" height="18" rx="4" class="faded"/>
  <text x="200" y="292" text-anchor="middle" class="caption" font-size="17">Two or three options are so far ahead,</text>
  <text x="200" y="314" text-anchor="middle" class="caption" font-size="17" font-weight="700">the circle only needs 3 words.</text>

  <!-- RIGHT: flat distribution, top-p circle needs 9 words -->
  <text x="600" y="80" text-anchor="middle" class="label" font-size="20">Spread out</text>

  <rect x="452" y="90" width="290" height="180" rx="14" fill="none" class="accent-line" stroke-width="3" stroke-dasharray="6 6"/>
  <text x="730" y="82" text-anchor="end" class="accent-label" font-size="18">92%</text>

  <rect x="460" y="104" width="117" height="14" rx="3" class="accent"/>
  <rect x="460" y="122" width="108" height="14" rx="3" class="accent"/>
  <rect x="460" y="140" width="99" height="14" rx="3" class="accent"/>
  <rect x="460" y="158" width="99" height="14" rx="3" class="accent"/>
  <rect x="460" y="176" width="90" height="14" rx="3" class="accent"/>
  <rect x="460" y="194" width="81" height="14" rx="3" class="accent"/>
  <rect x="460" y="212" width="81" height="14" rx="3" class="accent"/>
  <rect x="460" y="230" width="81" height="14" rx="3" class="accent"/>
  <rect x="460" y="248" width="72" height="14" rx="3" class="accent"/>

  <rect x="460" y="282" width="36" height="12" rx="3" class="faded"/>
  <rect x="460" y="298" width="36" height="12" rx="3" class="faded"/>

  <text x="600" y="326" text-anchor="middle" class="caption" font-size="17">Options are all close contenders,</text>
  <text x="600" y="348" text-anchor="middle" class="caption" font-size="17" font-weight="700">so the circle grows to 9 words.</text>

  <!-- legend -->
  <g transform="translate(200,372)">
    <rect x="-14" y="-11" width="20" height="14" rx="3" class="accent"/>
    <text x="12" y="0" class="caption" font-size="15">inside the circle</text>
  </g>
  <g transform="translate(560,372)">
    <rect x="-14" y="-11" width="20" height="14" rx="3" class="faded"/>
    <text x="12" y="0" class="caption" font-size="15">cut off, never chosen</text>
  </g>
</svg>
